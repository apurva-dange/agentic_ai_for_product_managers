[project]
name = "product-discovery-agent"
version = "0.1.0"
description = "An explainable AI Product Discovery Agent demonstrating a full agentic tool-use loop."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
